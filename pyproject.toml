[project]
name = "kasparro-auditor"
version = "0.1.0"
description = "Kasparro Fresher AI Engineer assignment: AI-visibility analysis backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Candidate" }]

dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.120,<0.200",
    "uvicorn[standard]>=0.32,<0.40",
    # Validation + settings
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Database
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<0.21",
    "greenlet>=3.0,<4",
    # HTTP client (for tests + external calls if needed)
    "httpx>=0.27,<0.30",
    # LLM provider (Groq SDK is OpenAI-compatible) + structured outputs
    "groq>=0.13,<0.30",
    "instructor>=1.7,<2",
    # Logging
    "structlog>=24.4,<26",
    # URL normalization
    "urllib3>=2,<3",
    # Templating for diagnostics prompt
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.30",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<0.10",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasparro_auditor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data_pack", "provenance"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "PL"]
ignore = ["S101", "S603", "S607", "PLR0913", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
